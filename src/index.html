<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2a1e">
<title>皇者天下（單機版）</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="app">

  <header id="topBar">
    <div id="topBarTitle">皇者天下</div>
    <div id="topBarRes">
      <span id="topRes_food" class="topResItem"></span>
      <span id="topRes_wood" class="topResItem"></span>
      <span id="topRes_stone" class="topResItem"></span>
      <span id="topRes_gold" class="topResItem"></span>
    </div>
    <div id="topPower"></div>
  </header>

  <main id="screens">
    <section id="screenCity" class="screen activeScreen"></section>

    <section id="screenMap" class="screen">
      <div id="mapCanvasWrap"><canvas id="mapCanvas"></canvas></div>
      <div id="mapInfoPanel" class="panel"></div>
    </section>

    <section id="screenHero" class="screen"></section>
    <section id="screenArmy" class="screen"></section>
    <section id="screenMission" class="screen"></section>
    <section id="screenReport" class="screen"></section>
  </main>

  <nav id="bottomNav">
    <button class="navBtn navActive" data-screen="city">🏯<span>城池</span></button>
    <button class="navBtn" data-screen="map">🗺️<span>地圖</span></button>
    <button class="navBtn" data-screen="hero">🎖️<span>武將</span></button>
    <button class="navBtn" data-screen="army">⚔️<span>軍隊</span></button>
    <button class="navBtn" data-screen="mission">📜<span>戰役</span></button>
    <button class="navBtn" data-screen="report">📰<span>戰報</span></button>
  </nav>

  <div id="toastBox"></div>

  <div id="setupOverlay">
    <div id="setupBox">
      <div id="setupTitle">皇者天下</div>
      <div id="setupSubtitle">三國．單機戰略</div>
      <button id="continueBtn" class="setupBtn">繼續遊戲</button>
      <button id="newGameBtn" class="setupBtn">開始新遊戲</button>
    </div>
  </div>

</div>

<script src="utils/namespace.js"></script>
<script src="utils/idUtils.js"></script>
<script src="utils/timeUtils.js"></script>
<script src="utils/mathUtils.js"></script>
<script src="utils/resourceMath.js"></script>
<script src="utils/domUtils.js"></script>

<script src="data/factionDefs.js"></script>
<script src="data/resourceDefs.js"></script>
<script src="data/buildingDefs.js"></script>
<script src="data/unitDefs.js"></script>
<script src="data/heroDefs.js"></script>
<script src="data/technologyDefs.js"></script>
<script src="data/missionDefs.js"></script>
<script src="data/itemDefs.js"></script>
<script src="data/eventTypeDefs.js"></script>
<script src="data/achievementDefs.js"></script>
<script src="data/mapConfigDefs.js"></script>

<script src="models/ResourceState.js"></script>
<script src="models/BuildingState.js"></script>
<script src="models/CityState.js"></script>
<script src="models/HeroState.js"></script>
<script src="models/ArmyState.js"></script>
<script src="models/MapState.js"></script>
<script src="models/BattleState.js"></script>
<script src="models/MissionState.js"></script>
<script src="models/TechnologyState.js"></script>
<script src="models/PlayerState.js"></script>
<script src="models/SaveGame.js"></script>

<script src="systems/economySystem.js"></script>
<script src="systems/cityBuildingSystem.js"></script>
<script src="systems/heroSystem.js"></script>
<script src="systems/armySystem.js"></script>
<script src="systems/combatSystem.js"></script>
<script src="systems/mapSystem.js"></script>
<script src="systems/missionSystem.js"></script>
<script src="systems/technologySystem.js"></script>
<script src="systems/eventSystem.js"></script>
<script src="systems/achievementSystem.js"></script>
<script src="systems/aiSystem.js"></script>
<script src="systems/newGameSystem.js"></script>
<script src="systems/saveSystem.js"></script>
<script src="systems/gameLoopSystem.js"></script>

<script src="ui/dialog.js"></script>
<script src="ui/topBar.js"></script>
<script src="ui/bottomNav.js"></script>
<script src="ui/cityScreen.js"></script>
<script src="ui/mapScreen.js"></script>
<script src="ui/heroScreen.js"></script>
<script src="ui/armyScreen.js"></script>
<script src="ui/missionScreen.js"></script>
<script src="ui/reportScreen.js"></script>
<script src="ui/bootstrap.js"></script>
</body>
</html>
